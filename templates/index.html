<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="integration-token" content="{{ integration_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b1026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <title>繁星下載（串流影音下載）</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='compact.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='provider-ui.css') }}">
  <style>
    .download-action-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }

    /* 網址工具列與上方內容保留呼吸空間。 */
    .downloader {
      margin-top: 18px;
    }

    .url-row {
      gap: 8px;
    }

    .url-row .clear-url-button {
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--soft-bg) 88%, transparent);
      color: var(--muted);
      box-shadow: none;
    }

    .url-row .clear-url-button:hover {
      border-color: color-mix(in srgb, var(--accent) 34%, var(--line));
      background: color-mix(in srgb, var(--accent) 8%, var(--soft-bg));
      color: var(--accent);
      box-shadow: 0 9px 22px rgba(73, 63, 145, .10);
    }

    .support-cta-wrap {
      display: flex;
      justify-content: center;
      margin: 28px auto 8px;
      padding: 0 8px 8px;
    }

    .support-developer-button {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      min-height: 64px;
      max-width: 100%;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow: hidden;
      padding: 11px 22px;
      border: 1px solid color-mix(in srgb, #c6a15b 44%, var(--line));
      border-radius: 20px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--card) 94%, #fff7dc 6%), color-mix(in srgb, var(--card) 88%, #ede8ff 12%));
      color: var(--ink);
      box-shadow:
        0 18px 46px rgba(57, 48, 112, .16),
        inset 0 1px 0 rgba(255, 255, 255, .72);
      cursor: pointer;
      font: 800 16px/1.35 "Noto Sans TC", sans-serif;
      letter-spacing: .015em;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .support-developer-button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 18% 0%, rgba(255, 255, 255, .90), transparent 30%);
      opacity: .72;
      pointer-events: none;
    }

    .support-developer-button:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, #c6a15b 72%, var(--line));
      box-shadow:
        0 22px 54px rgba(57, 48, 112, .20),
        inset 0 1px 0 rgba(255, 255, 255, .82);
    }

    .support-developer-button:active {
      transform: translateY(0);
    }

    .support-button-icon {
      display: inline-flex;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: linear-gradient(145deg, #2c2157, #5c4f8f);
      color: #fff4d6;
      box-shadow: 0 8px 24px rgba(44, 33, 87, .28);
    }

    .support-button-icon svg {
      width: 27px;
      height: 27px;
    }

    .support-button-copy {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .support-button-copy span:first-child {
      white-space: nowrap;
    }

    .support-button-divider {
      color: color-mix(in srgb, #c6a15b 82%, var(--muted));
      font-weight: 900;
    }

    @media (max-width: 560px) {
      .support-cta-wrap {
        margin-top: 22px;
      }

      .support-developer-button {
        width: 100%;
        padding: 10px 13px;
        border-radius: 17px;
        font-size: 14px;
      }

      .support-button-icon {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
        border-radius: 12px;
      }

      .support-button-icon svg {
        width: 24px;
        height: 24px;
      }

      .support-button-copy {
        gap: 7px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="site-header-row">
      <a class="site-brand" href="/" aria-label="回到繁星下載首頁">
        <span class="site-brand-mark" aria-hidden="true"></span>
        <span class="site-brand-text">繁星下載</span>
        <span class="site-brand-wave" aria-hidden="true">〰</span>
      </a>
      <div class="top-actions"></div>
      <button id="hamburger-button" class="hamburger-button" type="button" aria-label="開啟選單" aria-expanded="false" aria-controls="main-menu-panel">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div id="main-menu-panel" class="main-menu-panel" role="menu" hidden>
      <button class="main-menu-row" type="button" role="menuitem" data-menu-action="home"><span aria-hidden="true">⌂</span><span>首頁</span></button>
      <button class="main-menu-row" type="button" role="menuitem" data-menu-action="focus-url"><span aria-hidden="true">↗</span><span>貼上網址</span></button>
      <button id="menu-theme-toggle" class="main-menu-row" type="button" role="menuitem"><span aria-hidden="true">◐</span><span>切換明暗</span></button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Starry.phd</p>
        <h1>繁星下載</h1>
        <p class="hero-subtitle">貼上網址，快速取得影片、音檔與字幕。</p>
      </div>
    </section>

    <section class="downloader">
      <form id="download-form">
        <div class="url-row">
          <input id="url" type="url" placeholder="貼上影片網址" autocomplete="off" inputmode="url" required>
          <button id="paste-url-button" class="paste-url-button" type="button">貼上網址</button>
          <button id="lookup-button" class="lookup-button" type="submit">解析網址</button>
          <button id="clear-url-button" class="clear-url-button" type="button">清空</button>
        </div>
      </form>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div id="provider-icons" class="provider-icons" aria-label="支援平台"></div>
    </section>

    <section id="result" class="result" hidden>
      <div class="media-card">
        <div class="thumb-wrap">
          <img id="thumbnail" alt="影片縮圖" hidden>
        </div>
        <div class="media-meta">
          <span id="source-label" class="source-label"></span>
          <h2 id="title"></h2>
        </div>
        <div id="subtitle-download-actions" class="subtitle-download-actions" hidden>
          <label id="subtitle-group" for="subtitle-language">
            <span>CC 字幕</span>
            <select id="subtitle-language"></select>
          </label>
          <button id="download-subtitle-button" class="download-button subtitle-button" type="button">下載 CC 字幕</button>
        </div>
      </div>

      <div class="download-action-grid">
        <button id="download-video-button" class="download-button download-action-button" type="button">下載影片</button>
        <button id="share-video-button" class="download-button download-action-button" type="button">分享影片</button>
        <button id="report-download-button" class="download-button download-action-button report-download-button" type="button">回報當前影片<br>無法下載</button>
        <button id="download-audio-button" class="download-button download-action-button" type="button">下載音檔</button>
        <button id="share-audio-button" class="download-button download-action-button" type="button">分享音檔</button>
      </div>

      <div id="download-progress" class="download-progress" hidden>
        <div class="download-progress-topline"><span id="download-progress-label">準備中…</span><strong id="download-progress-value">0%</strong></div>
        <div class="download-progress-track"><span id="download-progress-fill"></span></div>
      </div>
    </section>

    <div class="support-cta-wrap">
      <button id="support-developer-button" class="support-developer-button" type="button">
        <span class="support-button-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 9h11v5.3A4.7 4.7 0 0 1 11.3 19H9.7A4.7 4.7 0 0 1 5 14.3V9Z"/>
            <path d="M16 10h1.4a2.6 2.6 0 1 1 0 5.2H16"/>
            <path d="M8 5.5c0 1.1 1 1.4 1 2.5M12 5.5c0 1.1 1 1.4 1 2.5"/>
          </svg>
        </span>
        <span class="support-button-copy">
          <span>支持無廣告</span>
          <span class="support-button-divider" aria-hidden="true">|</span>
          <span>贊助開發者喝杯咖啡</span>
        </span>
      </button>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
