<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1026">
  <title>繁星回憶｜目前離線</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 15%, #332b77, transparent 36%), #0b1026; color: #f7f8ff; }
    main { width: min(88vw, 460px); padding: 32px 28px; border: 1px solid rgba(255,255,255,.14); border-radius: 24px; background: rgba(13,19,49,.84); box-shadow: 0 24px 70px rgba(0,0,0,.35); text-align: center; }
    .icon { font-size: 42px; line-height: 1; }
    h1 { margin: 18px 0 10px; font-size: 24px; }
    p { margin: 0; color: #cfd5f7; line-height: 1.75; }
    button { margin-top: 22px; border: 0; border-radius: 14px; padding: 12px 18px; font: inherit; font-weight: 800; cursor: pointer; background: #f4d37f; color: #241f42; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">✦</div>
    <h1>目前沒有網路連線</h1>
    <p>繁星回憶的解析與下載需要連線到來源平台。已經儲存到裝置的檔案不受影響；恢復網路後即可繼續使用。</p>
    <button type="button" onclick="location.reload()">重新連線</button>
  </main>
</body>
</html>
